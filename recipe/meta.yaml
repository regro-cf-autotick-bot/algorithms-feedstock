{% set name = "algorithms" %}
{% set version = "1.0.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/algorithms-{{ version }}.tar.gz
  sha256: e2d140bc315eb1e106f2ab8c1f2ec595e01cb1ef0aa1506d20f93f75cf9fd8b1

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - algorithms
    - algorithms.arrays
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/keon/algorithms
  summary: Pythonic Data Structures and Algorithms
  license: MIT
  license_file: LICENSE
  description: |
    Minimal and clean example implementations of data structures and algorithms
     in Python 3.

extra:
  recipe-maintainers:
    - thewchan
